<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F4F4F6">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nile Youth Network · Task Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F4F6; --surface:#FFFFFF; --ink:#111827; --muted:#5B6270; --line:#E1E3E8;
  --navy:#111111; --blue:#1D5FD1; --blue-soft:#EAF1FD; --btn:#1D5FD1;
  --green:#0D7548; --green-soft:#E0F5EA;
  --red:#C42626; --red-soft:#FDE9E9;
  --on-blue:#FFFFFF; --on-btn:#FFFFFF; --on-green:#FFFFFF; --on-red:#FFFFFF;
  --gray-soft:#EFF0F3; --icon-on:#FFFFFF; --c-blue:#1D5FD1; --c-green:#12805A; --c-purple:#7C4DDB; --c-orange:#E86A10; --c-pink:#D6336C; --c-teal:#0E9AA7; --c-amber:#C28400; --c-red:#C42626;
  --shadow:0 1px 2px rgba(15,34,64,.06),0 6px 18px rgba(15,34,64,.06);
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151515; --surface:#1E1E1E; --ink:#EDEDED; --muted:#A8A8A8; --line:#333333;
    --navy:#F5F5F5; --blue:#6AA6FF; --blue-soft:#1C2B45; --btn:#2F6FDB;
    --green:#4CD196; --green-soft:#14291F; --red:#FF7A7A; --red-soft:#3A1C1F;
    --on-blue:#08111F; --on-btn:#FFFFFF; --on-green:#06180F; --on-red:#1C0707;
  --gray-soft:#262626; --icon-on:#111111; --c-blue:#6AA6FF; --c-green:#4CD196; --c-purple:#A78BFA; --c-orange:#FF9A52; --c-pink:#F472B6; --c-teal:#3CC8D4; --c-amber:#FBBF24; --c-red:#FF7A7A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151515; --surface:#1E1E1E; --ink:#EDEDED; --muted:#A8A8A8; --line:#333333;
  --navy:#F5F5F5; --blue:#6AA6FF; --blue-soft:#1C2B45; --btn:#2F6FDB;
  --green:#4CD196; --green-soft:#14291F; --red:#FF7A7A; --red-soft:#3A1C1F;
  --on-blue:#08111F; --on-btn:#FFFFFF; --on-green:#06180F; --on-red:#1C0707;
  --gray-soft:#262626; --icon-on:#111111; --c-blue:#6AA6FF; --c-green:#4CD196; --c-purple:#A78BFA; --c-orange:#FF9A52; --c-pink:#F472B6; --c-teal:#3CC8D4; --c-amber:#FBBF24; --c-red:#FF7A7A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);margin:0;line-height:1.2;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
::placeholder{color:var(--muted);opacity:1}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand b{font-family:var(--head);font-size:18px;color:var(--navy);display:block;line-height:1.1}
.brand span{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;gap:10px;align-items:center;border-radius:10px;width:100%;text-align:left}
.nav button[aria-current="page"]{background:var(--acc-soft,var(--blue-soft));color:var(--ink);font-weight:600}
.nav button:hover{color:var(--ink);background:var(--blue-soft)}
.nav .badge{margin-left:auto}
.wave{display:block;width:100%;height:8px}
.badge{background:var(--red);color:var(--on-red);border-radius:99px;font-size:11.5px;font-weight:600;padding:1px 7px;min-width:20px;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;font-size:14px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* overdue pill */
.pill-over{display:inline-flex;align-items:center;gap:8px;background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}
.pulse-dot{position:relative;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.pulse-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--red);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse-dot::after{animation:none;opacity:.3;transform:scale(1.8)}}

main{padding:0 0 60px;min-width:0}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{font-size:26px;color:var(--navy)}
.page-head p{margin:2px 0 0;color:var(--muted)}
.page-head .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.panel h3{font-size:17px;margin-bottom:12px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}

.banner{border-radius:12px;padding:12px 14px;margin-bottom:16px;border:1px solid var(--line);background:var(--blue-soft);color:var(--ink);font-size:14px}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--blue-soft);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar.big{height:16px}
.big-num{font-family:var(--head);font-size:44px;font-weight:700;color:var(--navy);line-height:1}
.over-panel{background:var(--red-soft);border-color:var(--red)}
.over-panel h3{color:var(--red);display:flex;gap:10px;align-items:center}
.ok-panel{background:var(--green-soft);border-color:var(--green)}
.ok-panel h3{color:var(--green)}

/* task cards & kanban */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.col{background:var(--blue-soft);border-radius:14px;padding:12px;min-height:120px}
.col h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;margin:2px 2px 10px;color:var(--navy)}
.col h3 span{font-family:var(--body);font-weight:600;font-size:12.5px;background:var(--surface);border-radius:99px;padding:1px 9px;color:var(--muted)}
.col.c-done{background:var(--green-soft)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--blue)}
.tcard.over{border-color:var(--red);border-left:5px solid var(--red)}
.tcard.done h4{text-decoration:line-through;color:var(--muted)}
.tcard h4{font-size:15px;margin:6px 0 10px;font-weight:600}
.tc-top{display:flex;gap:8px;align-items:center}
.tc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted);gap:8px}
.red{color:var(--red);font-weight:600}
.prio{font-size:12px;font-weight:600;border-radius:6px;padding:1px 8px;background:var(--blue-soft);color:var(--blue)}
.prio.p-high{background:var(--blue);color:var(--on-blue)}
.prio.p-low{background:transparent;border:1px solid var(--line);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 4px}

.av{border-radius:50%;object-fit:cover;flex:none;display:inline-block;vertical-align:middle}
.av.ini{background:var(--blue);color:var(--on-blue);display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.who{display:inline-flex;align-items:center;gap:6px}

/* rows / tables */
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:160px}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.clickable{cursor:pointer}
.clickable:hover .t{color:var(--blue)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:var(--blue-soft);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--head);font-size:28px;display:block;color:var(--navy)}
.stat span{font-size:13px;color:var(--muted)}
.stat.s-red b{color:var(--red)} .stat.s-green b{color:var(--green)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=date],input[type=time],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.filters select{width:auto}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
.tag.todo{background:var(--blue-soft);color:var(--blue)}
.tag.progress{background:var(--blue);color:var(--on-blue)}
.tag.done{background:var(--green-soft);color:var(--green)}
.tag.over{background:var(--red-soft);color:var(--red)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-head h3{margin:0 auto 0 4px;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day:hover:not(.blank){border-color:var(--blue)}
.day.today .dn{background:var(--blue);color:var(--on-blue)}
.day.sel{outline:2px solid var(--blue)}
.dn{font-size:12.5px;font-weight:600;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;align-items:center}
.ev{font-size:11.5px;border-radius:5px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--blue-soft);color:var(--blue);font-weight:500}
.ev.over{background:var(--red);color:var(--on-red)}
.ev.done{background:var(--green-soft);color:var(--green);text-decoration:line-through}
.ev.meet{background:var(--navy);color:var(--surface)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.dot.over{background:var(--red)} .dot.done{background:var(--green)} .dot.meet{background:var(--navy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:640px){
  .day{min-height:58px;padding:4px;align-items:center}
  .ev{display:none}.dots{display:flex;justify-content:center}
  .dayhead{justify-content:center}
}

/* meetings */
.mcard{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.mcard:last-child{border-bottom:0}
.dateblock{flex:none;width:56px;text-align:center;border-radius:12px;background:var(--navy);color:var(--surface);padding:6px 0;line-height:1.1}
.dateblock b{font-family:var(--head);font-size:22px;display:block}
.dateblock span{font-size:12px}
.minute{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface)}
.minute summary{cursor:pointer;padding:12px 14px;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.minute summary::-webkit-details-marker{display:none}
.minute summary b{font-family:var(--head);font-size:16px;color:var(--navy)}
.minute[open] summary{border-bottom:1px solid var(--line)}
.minute .mb{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.minute h5{margin:0 0 3px;font-size:13px;color:var(--muted);font-weight:600}
.minute p{margin:0;white-space:pre-wrap}

/* dialogs */
dialog{border:0;border-radius:16px;padding:0;width:min(660px,calc(100vw - 20px));max-height:calc(100vh - 30px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,20,40,.55)}
.dlg-in{padding:20px;overflow:auto;max-height:calc(100vh - 30px)}
.dlg-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.dlg-head h3{font-size:20px;color:var(--navy);flex:1}
.x-close{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:4px}
.field small{color:var(--muted);display:block;margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--surface);border:0;padding:8px;cursor:pointer;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn)}
.seg button.g[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
input[type=range]{width:100%;accent-color:var(--blue)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:8px 0 12px;align-items:center}
.alert-over{background:var(--red-soft);border:1px solid var(--red);color:var(--red);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-weight:600}
.alert-over .btn{margin-left:auto}
.tl{margin:10px 0;border-left:2px solid var(--line);padding-left:14px}
.tl .it{margin-bottom:12px;position:relative}
.tl .it::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.tl .it.status::before{background:var(--green)}
.tl .it .h{font-size:13px;color:var(--muted)}
.tl .it p{margin:2px 0 0;white-space:pre-wrap}
.compose{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--ink);border-radius:99px;padding:3px 8px 3px 4px;font-size:13.5px}
.chip .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.picker{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;background:var(--surface)}
.picker input{border:0 !important;flex:1;min-width:130px;padding:5px !important;outline:none}
.plist{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:220px;overflow:auto}
.popt{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;cursor:pointer;text-align:left}
.popt:hover{background:var(--blue-soft)}
.pempty{padding:10px;color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:100;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.toast button{background:var(--surface);color:var(--navy);border:0;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.btn.wa{background:#15803D;border-color:#15803D;color:#fff}
.filters input{flex:1;min-width:180px;width:auto}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0}
.ck span{flex:1}.ckdone{text-decoration:line-through;color:var(--muted)}
.ck input[type=checkbox]{width:18px;height:18px;accent-color:var(--green);flex:none}
#themeBtn{min-width:92px;justify-content:center}
.demobar{background:var(--blue-soft);border-bottom:1px solid var(--line);font-size:13.5px}
.demo-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px}
.demo-in .seg{flex-wrap:wrap}.demo-in b{color:var(--navy)}
/* brand images: logo, blurred page background, photo menu */
.brand img.logo{height:44px;width:auto;max-width:130px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;border:1px solid var(--line);flex:none}
.login-logo{display:block;height:64px;width:auto;max-width:100%;margin:0 auto 12px;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--line)}
html.has-photo body::before{content:"";position:fixed;inset:-24px;z-index:-1;background:var(--bg-img) center/cover no-repeat;filter:blur(16px);opacity:.10;pointer-events:none}
@media (prefers-color-scheme:dark){html.has-photo:not([data-theme="light"]) body::before{opacity:.16}}
:root[data-theme="dark"].has-photo body::before{opacity:.16}
.side.photo{border-radius:16px;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.side.photo::before{content:"";position:absolute;inset:-10px;z-index:-2;background:var(--nav-img) center/cover no-repeat;filter:blur(4px)}
.side.photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,10,18,.80),rgba(6,10,18,.90))}
.side.photo .nav{padding:8px}
.side.photo .navh{color:rgba(255,255,255,.74)}
.side.photo .nav button{color:#F3F5F8;padding:8px 10px}
.side.photo .nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.side.photo .nav button[aria-current="page"]{background:rgba(255,255,255,.22);color:#fff}
.side.photo .nav .ic{background:var(--acc,#5B6270);color:var(--icon-on);border-radius:8px;padding:5px;box-sizing:content-box}
@media (max-width:940px){.side.photo{border-radius:12px}}

/* ---- v3: accent cards, attachments, work areas, finance ---- */
[class*="acc-"]{--acc-soft:color-mix(in srgb,var(--acc) 12%,var(--surface));--acc-ink:color-mix(in srgb,var(--acc) 62%,var(--ink));--on-acc:#fff}
.acc-blue{--acc:var(--c-blue)}.acc-green{--acc:var(--c-green)}.acc-purple{--acc:var(--c-purple)}.acc-orange{--acc:var(--c-orange)}

<script>
/* ================== SETUP: paste your Supabase details here ==================
   Leave the two PASTE_... values as they are to run the built-in DEMO with sample data.
   Supabase dashboard -> Project Settings -> API. Both values are safe to publish:
   your data is protected by the access rules in supabase-setup.sql. */
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
/* ============================================================================ */

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const k in (props||{})){
    const v = props[k];
    if (v===null || v===undefined || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='text') el.textContent = v;
    else if (k==='style') el.setAttribute('style', v);
    else if (k==='value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid===null || kid===undefined || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const rc = (el,...kids) => el.replaceChildren(...kids.flat(Infinity).filter(k=>k!==null&&k!==undefined&&k!==false));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = () => iso(new Date());
const dShort = s => s ? parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : 'No date';
const dLong = s => s ? parseD(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}) : '';
const diffDays = s => Math.round((parseD(s) - parseD(todayStr()))/864e5);
const STATUS = {todo:'To do', progress:'In progress', done:'Done'};
const PRIO = {low:'Low', med:'Medium', high:'High'};
const isOver = t => t.status!=='done' && t.due && t.due < todayStr();
function dueLabel(t){
  if (!t.due) return 'No due date';
  if (t.status==='done') return 'Completed';
  const n = diffDays(t.due);
  if (n<0) return 'Overdue by '+(-n)+' day'+(-n>1?'s':'');
  if (n===0) return 'Due today';
  if (n===1) return 'Due tomorrow';
  return 'Due '+dShort(t.due);
}
function ago(ms){
  const m = Math.round((Date.now()-ms)/60000);
  if (m<1) return 'just now'; if (m<60) return m+' min ago';
  const hr = Math.round(m/60); if (hr<24) return hr+' h ago';
  const d = Math.round(hr/24); if (d<7) return d+' d ago';
  return new Date(ms).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
function toast(msg, label, fn){
  const host = $('#toastHost'); host.replaceChildren();
  const el = h('div',{class:'toast',role:'status'}, msg, label ? h('button',{onclick:()=>{host.replaceChildren(); fn&&fn();}}, label) : null);
  host.append(el); setTimeout(()=>{ if (el.isConnected) el.remove(); }, label ? 8000 : 3500);
}
function writeErr(e){
  if (e && e.custom) return e.message;
  if (e && (e.code==='42501' || /row-level security|permission/i.test(e.message||''))) return 'You do not have permission to do that. Ask an admin.';
  return 'Could not save. Check your connection and try again.';
}

/* ---------- state ---------- */
let sb=null, realtimeOn=false;
const S = { tasks:[], meetings:[], minutes:[], profiles:{}, me:null, isAdmin:false, canWrite:false,
  view:'main', calMonth:new Date(), calSel:null, filter:{person:'all',status:'all'}, q:'', team:'all',
  stage:'boot', session:null, errMsg:'', rsvps:[], posts:[], confirms:[], goals:[], needUpdate:false, prioMine:false, goalWeek:null, canMedia:false, refocus:null, attachments:[], areaPosts:[], trainDocs:[], fin:[], budgets:[], settings:{}, finFilter:{month:'all',kind:'all',cat:'all',q:''}, docCat:'all', pos:'', canSchedule:false, canMinutes:false, canFinance:false, canTrain:false, isTrainer:false };
const myId = () => (S.me && S.me.id) || null;
const pn = id => { const p=S.profiles[id]; return (p&&p.name)||(p&&p.email?p.email.split('@')[0]:'')||'Team member'; };
const myName = () => (S.me&&S.me.name)||(S.me&&S.me.email)||'A teammate';
function nm(id){ if(!id) return 'Someone'; if(id===myId()) return 'You'; return pn(id); }
function avatar(id,size=24){
  return h('span',{class:'av ini',style:'width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.45)+'px',text:(pn(id)[0]||'?').toUpperCase()});
}
const who = (id,size=22) => h('span',{class:'who'}, avatar(id,size), nm(id));

/* ---------- Supabase data layer ---------- */
const redirectUrl = () => location.origin + location.pathname;
async function dbw(q){ const r=await q; if(r.error){ console.error(r.error); const e=new Error(r.error.message); e.code=r.error.code; throw e; } return r.data; }
const tms = v => v ? new Date(v).getTime() : null;
/* ---------- Data loading: only fetch what changed (keeps Supabase data transfer low) ---------- */
const TABLES=['profiles','tasks','task_updates','meetings','minutes','meeting_rsvps','media_posts','media_confirmations','weekly_goals','attachments','area_posts','training_docs','finance_entries','finance_budgets','app_settings'];
const CORE=['profiles','tasks','task_updates','meetings','minutes'];
const DEP={tasks:['task_updates','attachments'],meetings:['meeting_rsvps','attachments'],media_posts:['media_confirmations','attachments'],minutes:['attachments'],finance_entries:['attachments'],area_posts:['attachments'],training_docs:['attachments']};
const RAW={}, TBL_ERR={}, DIRTY=new Set(); let lastFull=0;
const fetchTable = t => t==='task_updates' ? sb.from(t).select('*').order('created_at',{ascending:true}) : sb.from(t).select('*');
function trackWrites(client){
  const origFrom=client.from.bind(client);
  client.from=t=>{ const b=origFrom(t);
    ['insert','update','upsert','delete'].forEach(m=>{ const f=b[m]; if(typeof f!=='function') return; b[m]=function(...a){ DIRTY.add(t); if(m==='delete') (DEP[t]||[]).forEach(x=>DIRTY.add(x)); return f.apply(this,a); }; });
    return b; };
  const origRpc=client.rpc.bind(client); client.rpc=(...a)=>{ DIRTY.add('profiles'); return origRpc(...a); };
}
async function loadTables(names){
  const list=[...new Set(names)];
  const res=await Promise.all(list.map(fetchTable));
  list.forEach((t,i)=>{ TBL_ERR[t]=!!res[i].error; if(!res[i].error) RAW[t]=res[i].data; else if(!CORE.includes(t)) RAW[t]=[]; });
  const bad=list.findIndex((t,i)=>res[i].error&&CORE.includes(t));
  if(bad>=0){ const er=res[bad].error; console.error(er); if(S.stage==='boot'){ S.stage='error'; S.errMsg='Could not load data: '+er.message+'. Did you run supabase-setup.sql?'; render(); } else toast('Could not refresh. Check your connection.'); return false; }
  if(list.length===TABLES.length) lastFull=Date.now();
  rebuild(); return true;
}
const loadAll = () => loadTables(TABLES);
function rebuild(){
  const rows=t=>RAW[t]||[], tms_=tms;
  S.needUpdate=TABLES.filter(t=>!CORE.includes(t)).some(t=>TBL_ERR[t]);
  S.profiles={}; rows('profiles').forEach(p=>{ S.profiles[p.id]={id:p.id,name:p.full_name||'',email:p.email||'',phone:p.phone||'',role:p.role,active:!!p.active,isComms:!!p.is_comms,position:p.committee_position||'',isTraining:!!p.is_training}; });
  const ups={}; rows('task_updates').forEach(u=>{ (ups[u.task_id]=ups[u.task_id]||[]).push({id:u.id,by:u.user_id,at:tms_(u.created_at),text:u.text,kind:u.kind}); });
  S.tasks=rows('tasks').map(r=>({id:r.id,title:r.title,description:r.description||'',ownerId:r.owner_id,due:r.due||'',priority:r.priority,team:r.team||'',status:r.status,progress:r.progress||0,mentions:r.mentions||[],checklist:r.checklist||[],updates:ups[r.id]||[],createdBy:r.created_by,createdAt:tms_(r.created_at),completedAt:tms_(r.completed_at),updatedAt:tms_(r.updated_at)}));
  S.meetings=rows('meetings').map(r=>({id:r.id,title:r.title,date:r.date,time:r.time||'',place:r.place||'',agenda:r.agenda||'',kind:r.kind||'meeting',meetLink:r.meet_link||'',rsvpBy:r.rsvp_by||'',hostId:r.host_id||null,createdBy:r.created_by,createdAt:tms_(r.created_at)}));
  S.minutes=rows('minutes').map(r=>({id:r.id,title:r.title,date:r.date,attendees:r.attendees||'',summary:r.summary||'',decisions:r.decisions||'',actions:r.actions||'',meetingId:r.meeting_id||null,createdBy:r.created_by,createdAt:tms_(r.created_at)}));
  S.rsvps=rows('meeting_rsvps').map(r=>({id:r.id,meetingId:r.meeting_id,userId:r.user_id,response:r.response,comment:r.comment||''}));
  S.posts=rows('media_posts').map(r=>({id:r.id,title:r.title,platform:r.platform||'',caption:r.caption||'',link:r.link||'',postDate:r.post_date||'',confirmBy:r.confirm_by||'',status:r.status,createdBy:r.created_by,createdAt:tms_(r.created_at)}));
  S.confirms=rows('media_confirmations').map(r=>({id:r.id,postId:r.post_id,userId:r.user_id,response:r.response,comment:r.comment||''}));
  S.goals=rows('weekly_goals').map(r=>({id:r.id,userId:r.user_id,week:r.week_start,text:r.text,done:!!r.done}));
  S.attachments=rows('attachments').map(r=>({id:r.id,kind:r.owner_kind,ownerId:String(r.owner_id),name:r.name||'',path:r.path||'',url:r.url||'',mime:r.mime||'',size:Number(r.size)||0,by:r.uploaded_by,at:tms_(r.created_at)}));
  S.areaPosts=rows('area_posts').map(r=>({id:r.id,area:r.area,kind:r.kind||'Note',title:r.title,body:r.body||'',createdBy:r.created_by,createdAt:tms_(r.created_at)}));
  S.trainDocs=rows('training_docs').map(r=>({id:r.id,title:r.title,category:r.category||'Other',date:r.doc_date||'',description:r.description||'',createdBy:r.created_by}));
  S.fin=rows('finance_entries').map(r=>({id:r.id,date:r.entry_date,kind:r.kind,category:r.category||'',description:r.description||'',party:r.party||'',amount:Number(r.amount)||0,createdBy:r.created_by}));
  S.budgets=rows('finance_budgets').map(r=>({id:r.id,category:r.category,amount:Number(r.amount)||0}));
  S.settings={}; rows('app_settings').forEach(r=>{ S.settings[r.key]=r.value; });
}

function afterLoad(){
  const p=S.profiles[myId()];

function buildFeed(){
  const items=[];
  S.tasks.forEach(t=>{
    (t.updates||[]).forEach(u=>{
      let type='update', ids=null;
      if(u.kind==='mention'){ type='mention'; try{ ids=JSON.parse(u.text); }catch(e){ ids=[]; } }
      else if(u.kind==='status') type=/changed to Done$/.test(u.text||'')?'done':'status';
      items.push({at:u.at,type,by:u.by,t,text:u.text,ids});
    });
    if(t.createdAt) items.push({at:t.createdAt,type:'new',by:t.createdBy,t});
  });
  S.meetings.forEach(m=>{ if(m.createdAt) items.push({at:m.createdAt,type:'meeting',by:m.createdBy,m}); });
  S.posts.forEach(p=>{ if(p.createdAt) items.push({at:p.createdAt,type:'post',by:p.createdBy,p}); });
  return items.filter(i=>i.at).sort((a,b)=>b.at-a.at);
}

const TASK_COLS={title:'title',description:'description',ownerId:'owner_id',due:'due',priority:'priority',team:'team',status:'status',progress:'progress',mentions:'mentions',checklist:'checklist'};
function taskDb(patch){
  const o={};
  for(const k in patch){
    if(k==='completedAt') o.completed_at=patch[k]?new Date(patch[k]).toISOString():null;
    else if(TASK_COLS[k]) o[TASK_COLS[k]]=(k==='due'&&!patch[k])?null:patch[k];

function makeDemoClient(){
  let seq=1000; const stamp=()=>new Date().toISOString();
  const cascade={tasks:[['task_updates','task_id']],meetings:[['meeting_rsvps','meeting_id']],media_posts:[['media_confirmations','post_id']]};
  const from=name=>{
    let op='select',payload=null,filters=[],opts=null,single=false;
    const api={ select(){return api}, order(){return api}, eq(k,v){filters.push([k,v]);return api}, single(){single=true;return api},
      insert(r){op='insert';payload=r;return api}, update(r){op='update';payload=r;return api}, upsert(r,o){op='upsert';payload=r;opts=o;return api}, delete(){op='delete';return api},
      then(res,rej){ return Promise.resolve(run()).then(res,rej); } };
    function run(){
      const rows=demoDB[name]; if(!rows) return {data:null,error:{message:'Unknown table '+name}};
      const match=r=>filters.every(([k,v])=>r[k]===v);
      if(op==='select') return {data:rows.filter(match).map(r=>({...r})),error:null};
      if(op==='insert'){ const row={id:'d'+(++seq),created_at:stamp(),...payload}; rows.push(row); return {data:single?{id:row.id}:[row],error:null}; }
      if(op==='update'){ rows.filter(match).forEach(r=>Object.assign(r,payload)); return {data:null,error:null}; }
      if(op==='delete'){ const gone=rows.filter(match).map(r=>r.id); demoDB[name]=rows.filter(r=>!match(r)); (cascade[name]||[]).forEach(([t,c])=>{ demoDB[t]=demoDB[t].filter(r=>!gone.includes(r[c])); }); demoDB.attachments=demoDB.attachments.filter(a=>!gone.includes(a.owner_id)); return {data:null,error:null}; }
      if(op==='upsert'){ const keys=((opts&&opts.onConflict)||'id').split(','); const ex=rows.find(r=>keys.every(k=>r[k]===payload[k])); if(ex) Object.assign(ex,payload); else rows.push({id:'d'+(++seq),...payload}); return {data:null,error:null}; }
    }
    return api;
  };
  const rpc=async(fn,a)=>{ const p=demoDB.profiles.find(x=>x.id===a.target); if(p){ if(fn==='admin_set_profile'){ p.role=a.new_role; p.active=a.new_active; } if(fn==='admin_set_position'){ p.committee_position=a.new_position; p.is_training=a.new_training; if(['chair','secretary'].includes(a.new_position)) p.role='admin'; } } return {data:null,error:null}; };
  const nope=async()=>({data:{},error:{message:'This is demo mode. Use the "View as" menu at the top to preview each role.'}});
  const storage={from:()=>({
    upload:async(path,file)=>{ demoBlobs[path]=URL.createObjectURL(file); return {data:{path},error:null}; },
    createSignedUrls:async paths=>({data:paths.map(p=>({path:p,signedUrl:demoBlobs[p]||null,error:null})),error:null}),
    createSignedUrl:async p=>({data:{signedUrl:demoBlobs[p]},error:null}),
    remove:async paths=>{ paths.forEach(p=>{ delete demoBlobs[p]; }); return {data:[],error:null}; } })};
  return {from,rpc,storage,channel:()=>({on(){return this},subscribe(){return this}}),
    auth:{getSession:async()=>({data:{session:S.session}}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}}),signOut:async()=>{},signInWithPassword:nope,signUp:nope,signInWithOtp:nope}};
}
function demoSwitch(key){
  demoPersona=key; const pr=DEMO_PERSONAS.find(x=>x[0]===key);
  const prof=pr[2]?demoDB.profiles.find(p=>p.id===pr[2]):null;
  S.session=prof?{user:{id:prof.id,email:prof.email}}:null;
  S.view='main'; S.goalWeek=null; paintDemoBar(); startSession();
}
function paintDemoBar(){
  const bar=$('#demoBar'); bar.hidden=!DEMO; if(!DEMO) return;
  const sel=h('select',{'aria-label':'View as',onchange:e=>demoSwitch(e.target.value)},...DEMO_PERSONAS.map(([k,l])=>h('option',{value:k,text:l}))); sel.value=demoPersona;
  bar.replaceChildren(h('div',{class:'wrap demo-in'},h('b',{text:'Demo mode'}),h('span',{class:'hint',text:'Sample data, nothing is saved. View as:'}),sel,
    h('button',{class:'btn small ghost',onclick:()=>{ demoDB=demoSeed(); toast('Sample data reset'); demoSwitch(demoPersona); }},'Reset sample data')));
}

   Put your own copies in an "assets" folder next to index.html for the most reliable result:
     assets/logo.jpg        (the logo)
     assets/nile-dam.jpg    (the Nile dam picture)
   The page tries those first, then the Postimages links, then a built-in placeholder. */
const BRAND = {
  logo:['assets/logo.jpg','https://i.postimg.cc/MWsj8c8B/images-%281%29.jpg','https://i.postimg.cc/Y9WS6C02/images-%281%29.jpg'],

const FALLBACK_NAV='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB2F0"/><stop offset="1" stop-color="#DCEBFA"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7FD6"/><stop offset="1" stop-color="#0E4A9E"/></linearGradient></defs><rect width="640" height="360" fill="url(#s)"/><path d="M0 210 L120 150 L240 200 L330 130 L460 190 L640 120 V360 H0z" fill="#6E8F6A"/><path d="M0 240 L120 190 L260 235 L380 170 L520 225 L640 170 V360 H0z" fill="#4F7A55"/><rect x="250" y="190" width="140" height="46" fill="#B9BDC4"/><rect x="250" y="190" width="140" height="8" fill="#D5D8DE"/><path d="M0 250 Q 80 238 160 250 T 320 250 T 480 250 T 640 250 V360 H0z" fill="url(#w)"/></svg>');
let brandLogo=null, brandImgs={nav:null,bg:null};
const bgOn = () => { try{ return localStorage.getItem('nyn-bg')!=='off'; }catch(e){ return true; } };
function setBg(on){ try{ localStorage.setItem('nyn-bg',on?'on':'off'); }catch(e){} paintBrand(); }
function loadFirst(urls){
  return new Promise(res=>{ let i=0; const next=()=>{ if(i>=urls.length) return res(null); const im=new Image(); im.onload=()=>res(urls[i]); im.onerror=()=>{ i++; next(); }; im.src=urls[i]; }; next(); });
}
function paintBrand(){
  const root=document.documentElement, on=bgOn(), nav=brandImgs.nav||FALLBACK_NAV, bg=brandImgs.bg||nav;
  root.style.setProperty('--nav-img','url("'+nav+'")'); root.style.setProperty('--bg-img','url("'+bg+'")');
  root.classList.toggle('has-photo',on); const side=$('#side'); if(side) side.classList.toggle('photo',on);
}
async function loadBrand(){
  const [logo,nav,bg]=await Promise.all([loadFirst(BRAND.logo),loadFirst(BRAND.nav),BRAND.bg?loadFirst(BRAND.bg):Promise.resolve(null)]);
  brandLogo=logo; brandImgs={nav,bg};
  if(logo){ const svg=document.querySelector('.brand svg'); if(svg){ const im=document.createElement('img'); im.className='logo'; im.alt='Nile Youth Network logo'; im.src=logo; svg.replaceWith(im); } }
  paintBrand(); if(S.stage!=='app') render();
}

function paintThemeBtn(){ const b=$('#themeBtn'), d=isDark(); const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute('content',d?'#151515':'#F4F4F6'); b.textContent=d?'☀ Light':'☾ Dark'; b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme'); }
try{ const sv=localStorage.getItem('nyn-theme'); if(sv==='light'||sv==='dark') root.setAttribute('data-theme',sv); }catch(e){}
$('#themeBtn').addEventListener('click',()=>{ const next=isDark()?'light':'dark'; root.setAttribute('data-theme',next); try{localStorage.setItem('nyn-theme',next);}catch(e){} paintThemeBtn(); });
paintThemeBtn();
