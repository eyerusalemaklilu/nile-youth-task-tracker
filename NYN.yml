# Optional: pings your Supabase project twice a week.
# Free Supabase projects pause after a week of no activity. This may help avoid that,
# but I could not confirm it always counts as activity. If the project ever pauses,
# open the Supabase dashboard and click "Restore project"; your data is kept.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY
# (GitHub repo -> Settings -> Secrets and variables -> Actions).
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null || true